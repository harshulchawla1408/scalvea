# ==============================================================================
# SCALVEA NGINX SERVER CONFIGURATION — PRODUCTION HOSTINGER VPS
# ==============================================================================
# This configuration implements optimal caching, compression, and security
# headers for Scalvea's Vite SSR + SPA e-commerce platform.
#
# Primary location on Hostinger VPS:
# /etc/nginx/sites-available/scalvea.com or /etc/nginx/conf.d/scalvea.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name scalvea.com www.scalvea.com;
    return 301 https://scalvea.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.scalvea.com;

    # SSL certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/scalvea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scalvea.com/privkey.pem;

    return 301 https://scalvea.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scalvea.com;

    root /var/www/scalvea/dist;
    index index.html;

    # ── SSL Configuration ──────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/scalvea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scalvea.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Compression (Gzip) ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        font/woff
        font/woff2;

    # ── TASK 3 & 6: 1-Year Immutable Caching for Versioned Assets ──────────
    # Vite bundles with content hashes (JS, CSS, hashed media)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── TASK 3: 1-Year Immutable Caching for Self-Hosted Fonts ─────────────
    # Chillax, Manrope, Jost WOFF2 variable fonts
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    # ── 30-Day Caching for Static Images, Icons & Media ────────────────────
    location ~* \.(?:ico|webp|png|jpg|jpeg|gif|svg|mp4|webm|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Robots & Sitemaps: Never Fall Back to SPA HTML ────────────────────
    location ~* (?:robots\.txt|.*sitemap.*\.xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/xml;
        try_files $uri =404;
    }

    # ── Canonical 301 Redirects for Legacy / Alternate URLs ────────────────
    # Prevents Google Search Console redirect chains and duplicate discovery
    location = /blog { return 301 https://scalvea.com/blogs; }
    location = /support { return 301 https://scalvea.com/contact; }
    location = /faqs { return 301 https://scalvea.com/faq; }
    location = /terms-conditions { return 301 https://scalvea.com/terms-of-service; }
    location = /return-refund-policy { return 301 https://scalvea.com/returns-policy; }
    location = /shipping-returns { return 301 https://scalvea.com/shipping-policy; }
    location = /products { return 301 https://scalvea.com/shop; }

    # Redirect legacy /blog/:slug to canonical /blogs/:slug
    location ^~ /blog/ {
        rewrite ^/blog/(.*)$ https://scalvea.com/blogs/$1 permanent;
    }

    # Redirect legacy /products/:slug to canonical /product/:slug
    location = /products/hair-growth-serum { return 301 https://scalvea.com/product/follicle-8-hair-growth-serum; }
    location = /products/hair-growth-shampoo { return 301 https://scalvea.com/shop; }
    location ^~ /products/ {
        rewrite ^/products/(.*)$ https://scalvea.com/product/$1 permanent;
    }

    # Shortened blog slug redirects to full canonical slugs
    location = /blogs/dht-and-hair-loss { return 301 https://scalvea.com/blogs/dht-and-hair-loss-explained-simply; }
    location = /blogs/hair-growth-routine { return 301 https://scalvea.com/blogs/hair-growth-routine-for-thinning-hair; }
    location = /blogs/postpartum-hair-loss { return 301 https://scalvea.com/blogs/postpartum-hair-loss-whats-normal-and-whats-not; }
    location = /blogs/stress-hair-loss { return 301 https://scalvea.com/blogs/how-stress-actually-affects-your-hair; }
    location = /blogs/why-is-my-hair-thinning { return 301 https://scalvea.com/blogs/why-is-my-hair-thinning-7-real-causes; }
    location = /blogs/best-ingredients-for-hair-regrowth { return 301 https://scalvea.com/blogs/best-ingredients-for-hair-regrowth-according-to-research; }

    # ── HTML & Dynamic Pre-Rendered Routes: Must-Revalidate ────────────────
    # Prevents serving stale application code or old product prices
    location ~* \.(?:html|json)$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ── SPA / SSR Static Fallback ──────────────────────────────────────────
    # Checks for pre-rendered route/index.html first, then falls back to SPA index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ── Strict Safeguard: Never Cache Private / Checkout / Auth ────────────
    location ~* ^/(?:api|checkout|account|admin)/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
